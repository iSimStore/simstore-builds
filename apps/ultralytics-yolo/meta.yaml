description:
  en: On-device computer vision with YOLO models for detection, segmentation, depth, classification, pose and oriented bounding boxes. Live inference requires a camera; Simulator hardware support is limited.
  zh-Hans: 使用 YOLO 模型进行目标检测、分割、深度估计、分类、姿态估计和旋转框检测。实时推理依赖摄像头，Simulator 硬件支持有限。
categories:
  - developer-tools
