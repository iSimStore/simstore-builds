description:
  en: Import TrueType and OpenType fonts from Files, preview their characters and metadata, and create a font configuration profile. Also known as xFonts. Font import, profile installation, and font availability in other apps need separate testing in Simulator.
  zh-Hans: 从“文件”导入 TrueType 和 OpenType 字体，预览字符与元数据，并生成字体配置描述文件。原名 xFonts。字体导入、描述文件安装及其他应用中的字体可用性需在 Simulator 中单独实测。
categories:
  - utilities
